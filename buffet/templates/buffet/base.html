<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema Buffet - MVP{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">
    
    <!-- Topo / Header -->
    <header class="bg-white shadow p-4 flex justify-between items-center px-8">
        <h1 class="text-xl font-bold text-gray-800">Sistema Buffet [MVP]</h1>
        <div class="text-gray-600">Usuário: <strong>Fábio</strong> | <a href="/admin/" class="text-blue-600 underline">Admin do Django</a></div>
    </header>

    <div class="flex">
        <!-- Menu Lateral -->
        <aside class="w-64 bg-white h-screen shadow-md p-6 hidden md:block">
            <h2 class="text-gray-400 uppercase text-xs font-bold mb-4">Menu Lateral</h2>
            <ul class="space-y-2 text-sm font-semibold">
                <li><a href="{% url 'dashboard' %}" class="block p-2 rounded hover:bg-gray-50 text-gray-700">1. Dashboard Geral</a></li>
                <li><a href="{% url 'agenda' %}" class="block p-2 rounded hover:bg-gray-50 text-gray-700">2. Evento / Agenda</a></li>
                <li><a href="{% url 'agenda' %}" class="block p-2 rounded hover:bg-gray-50 text-gray-700">3. Agenda</a></li>
                <li><a href="{% url 'cozinha' %}" class="block p-2 rounded hover:bg-gray-50 text-gray-700">4. Cozinha (Explosão)</a></li>
                <li><a href="{% url 'equipe' %}" class="block p-2 rounded hover:bg-gray-50 text-gray-700">5. Escala de Equipe</a></li>
                <li><a href="{% url 'financeiro' %}" class="block p-2 rounded hover:bg-gray-50 text-gray-700">6. Financeiro / DRE</a></li>
            </ul>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="flex-1 p-8">
            {% block content %}
            <!-- O conteúdo específico de cada página entra aqui -->
            {% endblock %}
        </main>
    </div>
</body>
</html>
